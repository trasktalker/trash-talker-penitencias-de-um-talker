<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trash Talker - Recuperar senha</title>
  <link rel="icon" href="/logo-talker.svg" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/js/ui.js" defer></script>
  <script src="/js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <main class="auth-page" id="main-content" tabindex="-1">
    <aside class="auth-aside" aria-label="Conversa de bolso"><img src="/logo-talker.svg" width="48" height="48" alt="Trash Talker" /><p class="example-bubble">Um assunto de cada vez.</p><p class="example-bubble example-answer">Uma conversa pode começar com um oi.</p></aside>
    <div class="auth-card">
      <a class="auth-brand" href="/" aria-label="Trash Talker — início"><img src="/logo-talker.svg" alt="" width="56" height="56" /></a>
      <h1 class="auth-title">Trash Talker</h1>
      <p class="auth-subtitle">Recuperar senha</p>

      <div id="forgot-success" class="banner banner-success" hidden>
        Se o e-mail informado estiver cadastrado, você receberá um link para
        redefinir sua senha.
      </div>

      <!-- js/auth.js intercepta o envio e chama POST /api/forgot-password. -->
      <form id="forgot-password-form" class="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="m@example.com" required />
        </div>

        <div id="forgot-error" class="field-error" hidden></div>

        <button type="submit" class="btn-primary btn-block">
          Enviar link de recuperação
        </button>

        <p class="auth-footer-text">
          <a href="/login">
            <svg class="icon" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="10" x2="4" y2="10"></line><polyline points="9 5 4 10 9 15"></polyline></svg>
            Voltar para o login
          </a>
        </p>
      </form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
