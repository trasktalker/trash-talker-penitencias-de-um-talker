<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trash Talker - Nova senha</title>
  <link rel="icon" href="/logo-talker.svg" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/js/ui.js" defer></script>
  <script src="/js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <main class="auth-page" id="main-content" tabindex="-1">
    <aside class="auth-aside" aria-label="Conversa de bolso"><img src="/logo-talker.svg" width="48" height="48" alt="Trash Talker" /><p class="example-bubble">Um assunto de cada vez.</p><p class="example-bubble example-answer">Uma conversa pode começar com um oi.</p></aside>
    <div class="auth-card">
      <a class="auth-brand" href="/" aria-label="Trash Talker — início"><img src="/logo-talker.svg" alt="" width="56" height="56" /></a>
      <h1 class="auth-title">Trash Talker</h1>
      <p class="auth-subtitle">Criar nova senha</p>

      <!-- Um dos dois blocos abaixo fica visível, dependendo se a URL
           tem ?token=... válido - decidido por js/auth.js ao carregar
           a página (no original essa decisão era feita no servidor,
           lendo req.query.token). -->
      <div id="reset-invalid-link" class="field-error" hidden>
        Link de recuperação inválido ou expirado. Por favor, solicite um novo
        link.
      </div>

      <form id="reset-password-form" class="auth-form" hidden>
        <div class="field">
          <label for="password">Nova Senha</label>
          <input id="password" name="password" type="password" minlength="8" required />
          <ul id="password-requirements" class="password-requirements" hidden></ul>
        </div>
        <div class="field">
          <label for="confirm-password">Confirmar Nova Senha</label>
          <input id="confirm-password" type="password" minlength="8" required />
        </div>

        <div id="reset-error" class="field-error" hidden></div>

        <button type="submit" class="btn-primary btn-block">Redefinir Senha</button>
      </form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
