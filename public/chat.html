<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trash Talker</title>
  <link rel="icon" href="/logo-talker.svg" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/js/ui.js" defer></script>
  <script src="/js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar" aria-label="Navegação principal">
      <div class="sidebar-header">
        <a href="/dashboard" class="brand">
          <img class="brand-icon" src="/logo-talker.svg" alt="" />
          <span class="brand-name">Trash Talker</span>
        </a>
        <button type="button" class="sidebar-toggle" title="Ocultar barra lateral">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2.5"></rect>
            <line x1="7.5" y1="3.5" x2="7.5" y2="16.5"></line>
          </svg>
        </button>
      </div>

      <form class="sidebar-new-chat">
        <button type="submit">
          <svg class="icon" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><line x1="10" y1="4" x2="10" y2="16"></line><line x1="4" y1="10" x2="16" y2="10"></line></svg>
          <span class="sidebar-text">Nova conversa</span>
        </button>
      </form>

      <div class="sidebar-section sidebar-chats">
        <div class="sidebar-label">Conversas recentes</div>
        <ul class="chat-list"></ul>
      </div>

      <div class="sidebar-section sidebar-secondary" role="navigation" aria-label="Conta e configurações">
        <a href="/dashboard/settings">
          <svg class="icon" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="5"></circle><circle cx="10" cy="10" r="1.7"></circle><line x1="10" y1="2.4" x2="10" y2="4.3" stroke-width="2.4"></line><line x1="10" y1="15.7" x2="10" y2="17.6" stroke-width="2.4"></line><line x1="3.5" y1="6.2" x2="5.2" y2="7.2" stroke-width="2.4"></line><line x1="14.8" y1="12.8" x2="16.5" y2="13.8" stroke-width="2.4"></line><line x1="3.5" y1="13.8" x2="5.2" y2="12.8" stroke-width="2.4"></line><line x1="14.8" y1="7.2" x2="16.5" y2="6.2" stroke-width="2.4"></line></svg>
          <span class="sidebar-text">Configurações</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <a href="/dashboard/account" class="user-chip">
          <span class="avatar-slot"></span>
          <span class="user-name"></span>
        </a>
        <form>
          <button type="submit" class="logout-btn" title="Sair">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5H5a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h3"></path><line x1="8" y1="10" x2="16.5" y2="10"></line><polyline points="13.3 6.8 16.5 10 13.3 13.2"></polyline></svg>
          </button>
        </form>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button class="sidebar-toggle" title="Mostrar barra lateral">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2.5"></rect>
            <line x1="7.5" y1="3.5" x2="7.5" y2="16.5"></line>
          </svg>
        </button>
        <!-- No original, o título aqui é sempre o texto fixo "Conversa",
             não o título da conversa (mesma limitação preservada). -->
        <h1 class="topbar-title">Conversa</h1>
      </header>

      <main class="app-content" id="main-content" tabindex="-1">
        <div class="chat-view">
          <!-- js/chat.js busca as mensagens em GET /api/chats/<id> e
               preenche esta lista ao carregar a página. -->
          <div class="chat-messages" id="chat-messages" role="log" aria-label="Conversa" aria-live="polite" aria-relevant="additions text"></div>
          <div class="chat-composer">
            <div class="voice-label" id="voice-label"></div>
            <form class="composer" id="chat-form">
              <textarea aria-label="Digite sua mensagem..." id="chat-input" placeholder="Digite sua mensagem..." rows="1"></textarea>
              <div class="composer-actions">
                <div class="voice-controls" id="voice-controls"></div>
                <div class="personality-picker" id="personality-picker"></div>
                <button type="submit" id="chat-submit" aria-label="Enviar mensagem" title="Enviar mensagem" disabled>
                <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="16" x2="10" y2="4.3"></line><polyline points="5 9.3 10 4.3 15 9.3"></polyline></svg>
                </button>
              </div>
            </form>
          <div class="composer-disclosure"><p>A IA pode errar e não substitui ajuda profissional.</p></div>
</div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/personality-picker.js"></script>
  <script src="/js/voice.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
